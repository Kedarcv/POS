[PHP]
memory_limit=256M
max_execution_time=300
upload_max_filesize=100M
post_max_size=100M
max_input_time=300
error_reporting=E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED
display_errors=Off
log_errors=On
error_log=DATADIR_PLACEHOLDER/php_error.log
session.save_path=DATADIR_PLACEHOLDER/sessions
date.timezone=Africa/Harare
extension=mysqli
extension=pdo_mysql
extension=gd
extension=zip
extension=mbstring
extension=curl
extension=openssl
