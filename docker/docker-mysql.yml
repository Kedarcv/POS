
# Optional, self-hosted/server deployment path. For a single desktop/POS
# terminal, use the standalone desktop installer instead — it bundles its
# own MariaDB and needs no Docker. See INSTALL.md#desktop-install-recommended.

volumes:
    uploads:
        driver: local
    logs:
        driver: local
    mysql:
        driver: local

networks:
    app_net:

services:
    mysql:
        image: mariadb:10.5
        container_name: mysql
        restart: always
        ports:
          - "3307:3306"
        networks:
          - app_net
        volumes:
          - mysql:/var/lib/mysql:rw
        environment:
          - MYSQL_ROOT_PASSWORD=pointofsale
          - MYSQL_DATABASE=ospos
          - MYSQL_USER=admin
          - MYSQL_PASSWORD=pointofsale
